<script>
/* 起動中のエラーを、いちばん最初から拾う。読み込めなかったファイル名も残す。 */
window.__bootErr = [];
window.addEventListener("error", function(e){
  var t = e && e.target;
  var msg = (t && (t.src || t.href)) ? ("読めない: " + String(t.src || t.href).split("/").slice(-2).join("/"))
          : ((e && e.message) || "?");
  if (window.__bootErr.indexOf(msg) < 0) window.__bootErr.push(msg);
}, true);
</script>

<script>
/* iOSのdvh計算ズレ対策：実際の画面高さを実測してCSS変数に渡す */
(function(){
  function setVH(){
    var h = window.innerHeight;
    if (window.visualViewport && window.visualViewport.height > h) h = window.visualViewport.height;
    document.documentElement.style.setProperty("--vhpx", h + "px");
  }
  setVH();
  window.addEventListener("resize", setVH);
  window.addEventListener("orientationchange", function(){ setTimeout(setVH, 300); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", setVH);
})();
/* 部門（鮮魚／青果）を、画面が出る前に立てる。色のちらつきを防ぐため。
   URLで指定されていれば、その端末の記録より優先する。
   青果の人には ?seika 付きのURLを渡す、という使い方ができる。
   一度入ったら記録に残すので、次からはURLなしでも青果で開く。 */
(function(){
  try {
    var 合言葉 = {
      produce:"produce", seika:"produce", yasai:"produce", "青果":"produce", "野菜":"produce",
      fish:"fish", sengyo:"fish", sakana:"fish", "鮮魚":"fish", "魚":"fish"
    };
    var 生 = decodeURIComponent(location.search + " " + location.hash).toLowerCase();
    var 指定 = null;
    for (var k in 合言葉) if (new RegExp("(^|[?&#\\s])(dept=)?" + k + "([&\\s]|$)").test(生)) { 指定 = 合言葉[k]; break; }
    if (指定) {
      localStorage.setItem("dept", 指定);
      // 住所から合言葉を消す。消さないと、切り替えても読み込み直すたびに戻ってしまう
      if (history.replaceState) history.replaceState(null, "", location.pathname);
    }
  } catch (e) {}
  try {
    var d = localStorage.getItem("dept") || "fish";
    if (d !== "fish") document.documentElement.setAttribute("data-dept", d);
    else document.documentElement.removeAttribute("data-dept");
  } catch (e) {}
})();
</script>

/* 一覧の上の並び：スマホは小さめ、PC・タブレットでは大きく */

/* 管理画面の解錠（端末風の演出） */
@keyframes gsweep { 0% { transform: translateY(-12%); opacity: 0; } 12% { opacity: .9; } 88% { opacity: .9; } 100% { transform: translateY(1100%); opacity: 0; } }
@keyframes gblink { 50% { opacity: .15; } }

@keyframes gglitch { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }
.g-panel { animation: gpulse 4.5s ease-in-out infinite; }
.g-sweep { position: absolute; left: 0; right: 0; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(240,164,74,.55), transparent);
  animation: gsweep 5.2s linear infinite; pointer-events: none; }
.g-corner { position: absolute; width: 13px; height: 13px; border-color: rgba(240,164,74,.55); border-style: solid; opacity: .9; }
.g-blink { animation: gblink 1.4s steps(2) infinite; }
.g-ripple { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%;
  border: 1px solid #f0a44a; animation: gripple .5s ease-out forwards; pointer-events: none; }
.g-shake { animation: gglitch .32s ease; }
@media (prefers-reduced-motion: reduce) {

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overscroll-behavior: none; }
html { background: #8FA0B0; }
/* 固定シェル：ページ(window)は一切スクロールさせない。スクロールは #app-scroll の内側だけ。
   これによりiOSのラバーバンドで画面全体がずれる問題を構造的に根絶する。
   高さは 100dvh（動的ビューポート）でアドレスバーの出入りに追従させ、下部のすき間を防ぐ。 */
html, body { position:fixed; inset:0; width:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
#root { position:fixed; inset:0; }
#app-scroll { position:fixed; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; background: var(--bg); }

body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: var(--bg); }
.min-vh { min-height: 100vh; min-height: 100dvh; }
/* スマホではヘッダーのタイトルを隠してボタンにスペースを譲る */
/* タイトルは常時表示（モックアップ準拠） */
/* ポップ一覧：表示サイズを4段階で切り替え（リスト／小／中／大） */
.pop-grid { display: grid; gap: 12px; align-items: stretch; }

/* 中（標準） */
.pop-grid.v-md { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 620px)  { .pop-grid.v-md { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

@media (min-width: 1500px) { .pop-grid.v-md { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

/* 小（たくさん並べる） */
.pop-grid.v-sm { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 620px)  { .pop-grid.v-sm { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

@media (min-width: 1200px) { .pop-grid.v-sm { grid-template-columns: repeat(9, minmax(0, 1fr)); } }

/* 大（じっくり見る） */
.pop-grid.v-lg { grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 700px)  { .pop-grid.v-lg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.pop-grid.v-lg .pc-name { font-size: 15px; }

/* リスト（文字中心・横並び） */
.pop-grid.v-list { grid-template-columns: minmax(0, 1fr); gap: 7px; }
.pop-grid.v-list .ucard { display: flex; align-items: center; }
.pop-grid.v-list .pc-img { width: 62px; height: 62px; flex-shrink: 0; min-height: 0 !important; }
.pop-grid.v-list .pc-img img { width: 100%; height: 100%; object-fit: cover; }
.pop-grid.v-list .pc-body { flex: 1; min-width: 0; padding: 8px 12px; }
.pop-grid.v-list .pc-name { font-size: 13.5px; }
/* iPhoneで入力欄をタップしたときに画面が勝手に拡大するのを防ぐ。
   iOSは文字が16px未満の入力欄でズームするため、入力欄だけ16pxに揃える */
html, body { overflow-x: hidden; max-width: 100%; }
* { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

@supports (-webkit-touch-callout: none) {
  /* iOSは16px未満の入力欄でズームするため、実サイズを16pxに揃える。
     幅の広い入力欄（本文・品名など）だけが対象で、狭い欄は個別に維持 */
  input[type="text"], input[type="password"], input[type="search"],
  input[type="tel"], input[type="email"], input[type="date"],
  input[type="number"], input:not([type]), textarea, select {
    font-size: 16px !important;
  }
  /* 数量など、幅の狭い欄は文字が溢れないよう詰める */
  input[inputmode="decimal"], input[inputmode="numeric"] {
    font-size: 16px !important;
    letter-spacing: -0.5px;
    padding-left: 1px !important; padding-right: 1px !important;
  }
  select { font-size: 16px !important; }
}
/* 入力中に画面が横へずれないようにする */
body { position: relative; overscroll-behavior-y: none; }
/* 画面いっぱいの要素がはみ出さないように */
#root { max-width: 100vw; overflow-x: hidden; }

/* 発注表：A4横に印刷する */
@media print {
  body * { visibility: hidden; }
  #sheetPrint, #sheetPrint * { visibility: visible; }
  #sheetPrint { position: absolute; left: 0; top: 0; width: 100%; }
  @page { size: A4 landscape; margin: 8mm; }
}
#sheetPrint { display: none; }
/* 曜日ごとのまとまりを枠で囲む */
.day-box { border: 1.2px solid #333; border-radius: 1mm; overflow: hidden; margin-bottom: 3mm; break-inside: avoid; }
.day-head { padding: 1.2mm 2.5mm; font-weight: 700; border-bottom: 1px solid #333; background: #f2f2f2; }
.sheet-tbl { width: 100%; border-collapse: collapse; }
.sheet-tbl th, .sheet-tbl td { border: 1px solid #333; padding: 2px 3px; font-size: 8.5pt; text-align: center; }
.sheet-tbl th { background: #eee; font-weight: 700; }
.sheet-tbl td.nm { text-align: left; font-weight: 700; padding-left: 6px; white-space: nowrap; }
.sheet-tbl td.sun { color: #c00; }
.sheet-tbl th.sun { color: #c00; }
.sheet-tbl th.sat, .sheet-tbl td.sat { color: #06c; }
/* 予約カタログ：表示サイズを4段階で切り替え */
.cat-grid { display: grid; gap: 11px; align-items: start; }
.cat-grid.c-md { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 620px)  { .cat-grid.c-md { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px)  { .cat-grid.c-md { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1300px) { .cat-grid.c-md { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

.cat-grid.c-lg { grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 760px)  { .cat-grid.c-lg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1200px) { .cat-grid.c-lg { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.cat-grid.c-sm { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 620px)  { .cat-grid.c-sm { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px)  { .cat-grid.c-sm { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1300px) { .cat-grid.c-sm { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

.cat-grid.c-list { grid-template-columns: minmax(0, 1fr); gap: 7px; }
/* GNE（POP画像ジェネレーター）：PCでは左にプレビュー固定＋右に設定を並べる */
@media (min-width: 900px) {
  .gne-grid { display: grid !important; grid-template-columns: minmax(0, 420px) minmax(0, 1fr) !important; gap: 18px !important; align-items: start; }
  .gne-preview { position: sticky; top: 12px; }
  .gne-preview canvas { max-height: calc(100vh - 130px); width: auto !important; max-width: 100% !important; margin: 0 auto; }
}
/* HIG風ボタン：押した瞬間うっすら透明＋わずかに縮む */
.hig-pill { transition: opacity .15s ease, transform .15s ease; -webkit-tap-highlight-color: transparent; }
.hig-pill:active { opacity:.55; transform:scale(.96); }
#splash { position:fixed; inset:0; z-index:9999; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .45s ease; }
#splash.hide { opacity:0; pointer-events:none; }
#splash .sp-logo { width:min(268px, 62vw); height:auto; filter:drop-shadow(0 10px 26px rgba(32,110,120,0.22)); animation:spPop .7s cubic-bezier(.16,1.3,.3,1) both; }
@keyframes spPop { from { transform:scale(.55); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes spFade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
@keyframes radialPulse { 0% { transform:scale(1); } 35% { transform:scale(1.16); } 100% { transform:scale(1); } }
@keyframes liked { 0% { transform:scale(1); } 40% { transform:scale(1.4); } 100% { transform:scale(1); } }
@keyframes spin { to { transform:rotate(360deg); } }
.spinner { width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes sheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
.hscroll::-webkit-scrollbar { display:none; }
.hscroll { scrollbar-width:none; }
@keyframes gneFloat { 0% { opacity:0; transform:translateY(8px) scale(0.5); } 25% { opacity:1; } 100% { opacity:0; transform:translateY(-20px) scale(1.15); } }
@keyframes gneBounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
@keyframes gneGlow { 0%,100% { box-shadow:0 3px 12px rgba(194,78,0,0.45); } 50% { box-shadow:0 4px 22px rgba(255,150,40,0.95); } }
.like-btn:active { animation: liked 0.3s ease; }
#barcode-print-portal { display: none; }
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  /* 印刷時に背景（納品会社の色・模様）を省略させない */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
  /* 固定シェル（画面ずれ対策）を印刷時だけ解除：しないと1ページ分で切れて2枚目以降が消える */
  html, body { position: static !important; overflow: visible !important; width: auto !important; height: auto !important; }
  #root { position: static !important; overflow: visible !important; height: auto !important; }
  #app-scroll { position: static !important; overflow: visible !important; height: auto !important; }
  body > #root { display: none !important; }
  #barcode-print-portal { display: block !important; position: static !important; overflow: visible !important; }
  #barcode-print-portal .bc-page { break-after: page; page-break-after: always; }
  #barcode-print-portal .bc-page:last-child { break-after: auto; page-break-after: auto; }
  #barcode-print-portal .bc-label { page-break-inside: avoid; break-inside: avoid; }
}

/* ───── 広い画面（パソコン）：左に行事カレンダー、右にメニューを置く ───── */
@media (min-width: 1280px) {
  /* 右の柱：メニュー */
  .menu-dock {
    right: 0 !important; left: auto !important;
    width: 288px !important;
    background: var(--card) !important;
    backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
    box-shadow: none !important;
    border-left: 1px solid var(--line);
    animation: none !important;
    z-index: 120 !important;
  }
  /* 項目を縦に引き伸ばさない */
  .menu-dock .menu-list { flex: 0 0 auto !important; }
  .menu-dock .menu-list .menu-item { flex: 0 0 auto !important; min-height: 48px !important; padding: 8px 12px !important; }
  .menu-dock .menu-list .menu-item span { font-size: 15px !important; }

  /* 左の柱：行事カレンダー */
  .cal-dock {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 320px; z-index: 120;
    overflow-y: auto;
    background: var(--card);
    border-right: 1px solid var(--line);
    padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
    box-sizing: border-box;
  }

  /* 本体は両側の柱の分だけ内側へ */
  #app-scroll { padding-left: 320px; padding-right: 288px; }
  /* 右にずっと出ているので、上の行のメニューのボタンは要らない */
  .board-head .bh-menu { display: none !important; }
  /* 左に出ているので、メニューの中の行事カレンダーも要らない */
  .menu-row-bundle { display: none !important; }
  /* さがすボタンは右の柱の内側に寄せる */
  .fab-search { right: 316px !important; }
}
</style>

<script>window.__splashT0 = Date.now();
/* 起動の見張り。画面が出たら必ず起動画面を消し、JSでエラーが出たらすぐ案内を出す */
(function(){
  var 出した = false;
  function 案内(理由){
    if (出した) return; 出した = true;
    // 電波が不安定でファイルを取りこぼしただけ、ということが多い。
    // まず一度だけ黙って読み込み直す。それでも駄目なら案内を出す。
    try {
      if (!sessionStorage.getItem("bootRetry")) {
        sessionStorage.setItem("bootRetry", "1");
        location.replace(location.pathname + "?r=" + Date.now());
        return;
      }
    } catch (e) {}
    var s = document.getElementById("splash"); if (!s) return;
    var d = document.createElement("div");
    d.style.cssText = "font-size:12px;color:#a05a00;font-weight:700;text-align:center;line-height:1.8;padding:0 28px;margin-top:6px";
    d.innerHTML = 理由 === "error"
      ? "うまく開けませんでした。<br>下のボタンで読み込み直してください。"
      : "読み込みに時間がかかっています。<br>電波の良い場所で再読み込みしてください。";
    s.appendChild(d);
    var b = document.createElement("button");
    b.textContent = "読み込み直す";
    b.style.cssText = "margin-top:12px;padding:11px 26px;border:none;border-radius:11px;background:#C24E00;color:#fff;font-weight:800;font-size:14px";
    b.onclick = function(){
      try { if (window.caches && caches.keys) caches.keys().then(function(k){ k.forEach(function(n){ caches.delete(n); }); }); } catch(e) {}
      location.replace(location.pathname + "?r=" + Date.now());
    };
    s.appendChild(b);
    var m = document.createElement("div");
    m.id = "bootmsg";
    m.style.cssText = "margin-top:14px;font-size:10px;color:#999;text-align:center;padding:0 20px;word-break:break-all;line-height:1.6";
    s.appendChild(m);
  }
  // 起動の途中だけ見張る。画面が出たあとのエラー（あとから読む部品の
  // 取りこぼしなど）で読み込み直すと、作業中の状態が消えてしまう。
  window.addEventListener("error", function(){
    var r = document.getElementById("root");
    if (!document.getElementById("splash")) return;        // もう起動できている
    if (r && r.childNodes.length > 0) return;              // 画面は出ている
    案内("error");
    var m = document.getElementById("bootmsg");
    if (m) m.textContent = (window.__bootErr || []).join(" / ");
  }, true);
  // 見張りを付ける前に出たエラーがあれば、その場で出す
  if ((window.__bootErr || []).length) setTimeout(function(){
    var r0 = document.getElementById("root");
    if (!document.getElementById("splash") || (r0 && r0.childNodes.length > 0)) return;
    案内("error");
    var m = document.getElementById("bootmsg");
    if (m) m.textContent = window.__bootErr.join(" / ");
  }, 50);
  var 見張り = setInterval(function(){
    var r = document.getElementById("root"), s = document.getElementById("splash");
    if (!s) { clearInterval(見張り); return; }
    if (r && r.childNodes.length > 0 && Date.now() - window.__splashT0 > 900) {
      try { sessionStorage.removeItem("bootRetry"); } catch (e) {}   // 無事に開けた
      s.classList.add("hide");
      setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 500);
      clearInterval(見張り);
    }
  }, 300);
  setTimeout(function(){
    var r = document.getElementById("root");
    if (r && r.childNodes.length === 0) 案内("slow");
  }, 8000);
})();
</script>

<!-- 遅延読み込み：重いタブ（バーコード/入力ジェネレーター/魚図鑑/管理画面）は開いた時に読み込む -->
<script>
window.APP_VER = "20260929ze";
window.__lazyLoaded = {};
window.loadLazyTab = function(name){
  return new Promise(function(resolve, reject){
    if (window.__lazyLoaded[name]) { resolve(); return; }
    var s = document.createElement("script");
    s.src = "js/" + name + ".js?v=" + (window.APP_VER || "");
    s.onload = function(){ window.__lazyLoaded[name] = true; resolve(); };
    s.onerror = function(){ reject(new Error("load failed: " + name)); };
    document.head.appendChild(s);
  });
};
</script>
<script>
/* iOS：入力欄からフォーカスが外れたとき、拡大されたままにならないよう表示を戻す */
(function(){
  var vp = document.querySelector('meta[name=viewport]');
  if (!vp) return;
  var LOCK = "width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover";
  var FREE = "width=device-width, initial-scale=1.0, viewport-fit=cover";
  document.addEventListener("focusout", function(e){
    var t = e.target;
    if (!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    // 一度ゆるめてから戻すと、拡大された表示が元に戻る
    vp.setAttribute("content", FREE);
    setTimeout(function(){ vp.setAttribute("content", LOCK); }, 60);
  }, true);
})();
</script>
